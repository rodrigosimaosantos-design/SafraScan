<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SafraScan — acompanhamento inteligente da lavoura.">
  <title>Login | SafraScan</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/login.css">
  <script src="../js/sessao.js" defer></script>
  <script src="../js/app.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>
<body class="pagina-login">
  <main class="login-principal">
    <section class="login-card" aria-labelledby="titulo-login">
      <h1 id="titulo-login">Login</h1>
      <p id="login-message" class="ss-note" role="status" hidden></p>

      <form id="form-login" method="post" novalidate>
        <div class="campo">
          <label for="email-login">E-mail:</label>
          <input type="email" id="email-login" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="senha-login">Senha:</label>
          <input type="password" id="senha-login" autocomplete="current-password" required>
        </div>
        <div class="login-acoes">
          <button type="submit" class="botao-seta" aria-label="Entrar">
            <svg viewBox="0 0 28 8" width="28" height="8" aria-hidden="true">
              <path d="M0 4h26M22.5 1.5 26 4l-3.5 2.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
            </svg>
          </button>
        </div>
      </form>

      <a class="link-registro" href="cad_usuario.html">Registrar-se</a>
    </section>
  </main>

  <footer class="login-rodape">
    <div class="container">
      <div class="rodape-marca">
        <img src="../img/logo/logo_base_branco.svg" alt="SafraScan">
        <p class="rodape-info">Contato: (12) 3456-7890<br><em>©Todos os direitos reservados.</em></p>
      </div>
      <a class="rodape-ajuda" href="sobre.html">Precisa de ajuda?</a>
    </div>
  </footer>
</body>
</html>
