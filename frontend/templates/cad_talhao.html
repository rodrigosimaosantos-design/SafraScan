<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo talhão | SafraScan</title>

    <link rel="stylesheet" href="../css/base.css">

     <link rel="stylesheet" href="../css/cad_talhao.css">

    <script src="../js/sessao.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/cad_talhao.js" defer></script>
</head>

<body>

    <main class="cadastro-talhao-pagina">

        <nav class="atalhos-safrascan">
            <a href="tela_ajustes.html" title="Ajustes">⚙</a>
            <a href="index.html" title="Início">⌂</a>
            <a href="plantacao.html" title="Plantação">❀</a>
            <a href="sensores.html" title="Sensores">◉</a>
        </nav>

        <section class="cadastro-talhao-card">

            <div class="cadastro-card-cabecalho">
                <h1>Novo Talhão</h1>
                <a href="talhao.html" class="voltar-talhao">←</a>
            </div>

            <form id="form-talhao-cultura">

                <div class="campo-safra">
                    <label for="id-propriedade">
                        Propriedade
                    </label>

                    <select id="id-propriedade"
                            name="id_propriedade"
                            required>
                        <option value="">
                            Carregando propriedades...
                        </option>
                    </select>
                </div>

                <div class="campo-safra">
                    <label for="area-talhao">
                        Área (hectares)
                    </label>

                    <input
                        id="area-talhao"
                        name="area_ha"
                        type="number"
                        min="0.01"
                        max="99999999.99"
                        step="0.01"
                        placeholder="Ex.: 12,50"
                        required
                    >
                </div>

                <div class="campo-safra">
                    <label for="tipo-solo">
                        Tipo do Solo
                    </label>

                    <select id="tipo-solo"
                            name="tipo_solo"
                            required>

                        <option value="">Selecione</option>
                        <option value="Terra comum">Terra comum</option>
                        <option value="Vermelha">Vermelha</option>

                    </select>
                </div>

                <div class="separador-cultura"></div>

                <h2>Registre uma cultura</h2>

                <div class="campo-safra">
                    <label for="nome-cultura">
                        Nome da cultura
                    </label>

                    <input
                        id="nome-cultura"
                        name="nome_cultura"
                        type="text"
                        maxlength="100"
                        placeholder="Ex.: Soja"
                        required
                    >
                </div>

                <div class="campo-safra campo-ciclo">
                    <label for="ciclo-cultura">
                        Ciclo médio de dias
                    </label>

                    <input
                        id="ciclo-cultura"
                        name="ciclo_medio_dias"
                        type="number"
                        min="1"
                        step="1"
                        placeholder="Ex.: 120"
                        required
                    >
                </div>

                <p
                    id="mensagem-talhao"
                    class="mensagem-talhao"
                    role="status"
                    aria-live="polite"
                    hidden>
                </p>

                <div class="acoes-talhao">

                    <a id="botao-registrar" href="dashboard.html">
                        pular
                    </a>

                    <button id="botao-registrar" type="submit">
                        →
                    </button>
                </div>

            </form>

        </section>

    </main>

    <footer class="rodape-ajustes">

        <div class="rodape-ajustes-esquerda">
    
            <a href="index.html" class="logo-rodape">
                <img src="../img/logo/logo_base_branco.svg"
                     alt="SafraScan">
            </a>
    
            <div class="informacoes-rodape">
    
                <p>Contato: (12) 3456-7890</p>
    
                <p>© Todos os direitos reservados.</p>
    
            </div>
    
        </div>
    
    
        <a href="sobre.html" class="link-ajuda-rodape">
            Precisa de ajuda?
        </a>
    
    </footer>

</body>
</html>
