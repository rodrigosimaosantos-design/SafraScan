<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SafraScan - Login</title>

    <link rel="stylesheet" href="../css/base.css">
</head>

<body>

    <main class="pagina-login">

        <section class="login-card">

            <h1>Login</h1>

            <form>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha:</label>
                    <input
                        type="email"
                        id="senha"
                        name="senha"
                        required
                    >
                </div>

                <button type="submit" class="botao-login">
                    →
                </button>

            </form>

            <a href="registrar_user.html" class="registrar">
                Registrar-se
            </a>

        </section>

    </main>


    <footer class="rodape">

        <div class="rodape-esquerda">
            <img src="../img/safra_logo_pricipal.svg" class="logo">

            <div class="informacoes">
                <p>Contato: (12) 3456-7890</p>
                <p>©Todos os direitos reservados.</p>
            </div>

        </div>

        <a href="#" class="ajuda">
            Precisa de ajuda?
        </a>

    </footer>

</body>

</html>
